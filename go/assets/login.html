<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QBS Relay 登录</title>
<style>body{font-family:system-ui;background:#0d1117;color:#c9d1d9;max-width:720px;margin:40px auto;padding:0 18px}textarea{width:100%;min-height:260px;background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:12px;font-family:monospace}button{margin-top:12px;background:#238636;color:#fff;border:0;border-radius:6px;padding:10px 18px;cursor:pointer}code{color:#58a6ff}</style></head><body>
<h1>QBS Relay 添加账号</h1>
<p>把 <code>magpie-aws-quick</code> OAuth 会话或本地凭据导出的 session JSON 粘贴到下面。每个 JSON 会生成一个独立 CPA 凭据，并自动注册到 qbs-upstream 账号池。</p>
<textarea id="session" placeholder='{"jwt":"aoa...","ws_host":"qbs-...","aws_account_id":"722...","email":"..."}'></textarea>
<div><button id="save">添加账号</button></div>
<pre id="out"></pre>
<script>
document.getElementById('save').onclick=async()=>{
  const raw=document.getElementById('session').value.trim();
  document.getElementById('out').textContent='提交中…';
  if(!raw){document.getElementById('out').textContent='请先粘贴 session JSON';return}
  const methods=['auth.login.poll','auth.login.start'];
  for(const method of methods){
    try{
      const payload=method==='auth.login.poll'?{State:new URLSearchParams(location.search).get('state')||'',Metadata:{credential:raw}}:{};
      const resp=await fetch('/v0/plugin/'+method,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const text=await resp.text();
      document.getElementById('out').textContent=text.slice(0,2000);
      if(resp.ok) return;
    }catch(e){ document.getElementById('out').textContent=String(e); }
  }
};
</script></body></html>
