name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release delete "${GITHUB_REF_NAME}" --yes --cleanup-tag=false || true
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes \
            "dist/omc-qbs-relay_${VERSION}_linux_amd64.zip" \
            "dist/omc-qbs-relay_${VERSION}_linux_arm64.zip" \
            "dist/omc-qbs-relay.omc.json" \
            "dist/checksums.txt"
