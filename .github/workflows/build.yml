name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          cache: false
      - name: Download modules
        working-directory: go
        run: go mod download
      - name: Test
        working-directory: go
        run: go test ./...
      - name: Build c-shared
        working-directory: go
        env:
          CGO_ENABLED: 1
        run: go build -trimpath -buildmode=c-shared -ldflags "-s -w -X main.pluginVersion=0.1.0" -o ../build/omc-qbs-relay.so .
      - name: Smoke
        run: python3 smoke.py build/omc-qbs-relay.so 0.1.0
      - name: Package
        run: ./package.sh
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag=false || true
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes \
            build/omc-qbs-relay_0.1.0_linux_amd64.zip \
            build/omc-qbs-relay.omc.json \
            build/checksums.txt
